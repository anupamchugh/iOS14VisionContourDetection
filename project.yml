name: ContourLab
options:
  bundleIdPrefix: com.anupamchugh
  deploymentTarget:
    iOS: "27.0"
packages:
  ContourLabKit:
    path: ContourLabKit
targets:
  ContourLab:
    type: application
    platform: auto
    supportedDestinations: [iOS]
    sources: [ContourLab]
    dependencies:
      - package: ContourLabKit
    # contourlab://import?mode=objects|surfboard&file=<name>: pictures Folio routes here through the shared Alcor App Group.
    info:
      path: ContourLab/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.anupamchugh.ContourLab.import
            CFBundleURLSchemes: [contourlab]
    entitlements:
      path: ContourLab/ContourLab.entitlements
      properties:
        com.apple.security.application-groups: [group.com.anupamchugh.alcor]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anupamchugh.ContourLab
        DEVELOPMENT_TEAM: M6P56H6G97
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Contour Lab
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Contour Lab uses the camera to photograph the objects or surfboard you want to measure.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        TARGETED_DEVICE_FAMILY: "1,2"
